# Vulnerable dependencies (osv-scanner), leaked secrets (gitleaks, full
# history) and the ecosystem's own audit, via the shared workflow.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    uses: rishitank/.github/.github/workflows/security.yml@v1
    with:
      # osv-scanner (always on) reads bun.lock directly. `ecosystem` only picks
      # the native audit, and npm audit cannot read bun.lock (it needs
      # package-lock.json), so there is no native audit to run here.
      ecosystem: none
