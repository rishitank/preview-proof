name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  lighthouse:
    # Shared Lighthouse CI workflow; budgets live in lighthouserc.json and block the build.
    uses: rishitank/.github/.github/workflows/lighthouse-ci.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      # Node comes from .nvmrc. `install` is word-split, not run by a shell, so it must be
      # a single command; `build` runs as a script, so the bun install happens there.
      install: npm i -g bun@1.3.13
      build: bun install --frozen-lockfile && bun run build
      strict: true
